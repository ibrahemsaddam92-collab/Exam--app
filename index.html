<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة السادس الإعدادي - الشاملة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: var(--tg-theme-bg-color, #f3f4f6); 
            color: var(--tg-theme-text-color, #1f2937); 
        }
        .subject-card { 
            transition: transform 0.2s; 
        }
        .subject-card:active { 
            transform: scale(0.95); 
        }
        .modal { 
            transition: opacity 0.3s ease, transform 0.3s ease; 
        }
        .modal-hidden { 
            opacity: 0; 
            pointer-events: none; 
            transform: translateY(20px); 
        }
        .chapter-content { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.4s ease; 
        }
        .chapter-expanded { 
            max-height: 5000px; 
        }
        .badge { 
            font-size: 0.75rem; 
        }

        .bg-islamic { background: linear-gradient(135deg, #10b981, #059669); }
        .bg-arabic { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .bg-english { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .bg-biology { background: linear-gradient(135deg, #ec4899, #db2777); }
        .bg-math { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .bg-chemistry { background: linear-gradient(135deg, #14b8a6, #0d9488); }
        .bg-physics { background: linear-gradient(135deg, #f43f5e, #e11d48); }
    </style>
</head>
<body class="antialiased pb-10">

    <!-- شريط الترحيب -->
    <div class="bg-white dark:bg-gray-800 shadow-sm p-4 rounded-b-3xl mb-6 mx-2 mt-2 flex justify-between items-center" style="background-color: var(--tg-theme-secondary-bg-color, #ffffff);">
        <div>
            <h1 class="text-xl font-bold text-gray-800" style="color: var(--tg-theme-text-color, #1f2937);" id="welcome-text">مرحباً يا بطل 🎓</h1>

        <div class="text-2xl">🇮🇶</div>
    </div>

    <!-- شبكة المواد -->
    <div class="px-4 grid grid-cols-2 gap-4">
        <div onclick="openSubject('islamic', 'التربية الإسلامية')" class="subject-card bg-islamic text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
            <span class="text-3xl">🕋</span>
            <span class="font-bold">الإسلامية</span>
        </div>
        <div onclick="openSubject('arabic', 'اللغة العربية')" class="subject-card bg-arabic text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
            <span class="text-3xl">📖</span>
            <span class="font-bold">العربية</span>
        </div>
        <div onclick="openSubject('english', 'اللغة الإنكليزية')" class="subject-card bg-english text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
            <span class="text-3xl">🔠</span>
            <span class="font-bold">الإنكليزية</span>
        </div>
        <div onclick="openSubject('biology', 'الأحياء')" class="subject-card bg-biology text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
            <span class="text-3xl">🧬</span>
            <span class="font-bold">الأحياء</span>
        </div>
        <div onclick="openSubject('math', 'الرياضيات')" class="subject-card bg-math text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
            <span class="text-3xl">📐</span>
            <span class="font-bold">الرياضيات</span>
        </div>
        <div onclick="openSubject('chemistry', 'الكيمياء')" class="subject-card bg-chemistry text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
            <span class="text-3xl">🧪</span>
            <span class="font-bold">الكيمياء</span>
        </div>
        <div onclick="openSubject('physics', 'الفيزياء')" class="subject-card bg-physics text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer col-span-2">
            <span class="text-3xl">⚡</span>
            <span class="font-bold">الفيزياء</span>
        </div>
    </div>

    <!-- نافذة المادة المنبثقة -->
    <div id="subject-modal" class="modal modal-hidden fixed inset-0 z-50 flex flex-col bg-gray-50" style="background-color: var(--tg-theme-bg-color, #f3f4f6);">
        <div class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-10" style="background-color: var(--tg-theme-secondary-bg-color, #ffffff);">
            <h2 id="modal-title" class="text-xl font-bold" style="color: var(--tg-theme-text-color, #1f2937);">اسم المادة</h2>

        </div>

        <div id="modal-chapters-container" class="p-4 flex-1 overflow-y-auto space-y-3">
        </div>
    </div>

        function openSubject(subjectKey, subjectName) {
            const modal = document.getElementById('subject-modal');
            document.getElementById('modal-title').innerText = subjectName;
            const container = document.getElementById('modal-chapters-container');
            container.innerHTML = '';
            
            if (subjectsData[subjectKey] && subjectsData[subjectKey].length > 0) {
                subjectsData[subjectKey].forEach(unit => {
                    let unitHTML = `
                        <div class="mb-4">
                            <h3 class="text-md font-extrabold text-emerald-800 bg-emerald-50 p-3 rounded-lg border border-emerald-200 mb-2">${unit.title}</h3>
                            <div class="space-y-2">
                    `;

                    unit.subsections.forEach(sub => {
                        unitHTML += `
                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden" style="background-color: var(--tg-theme-secondary-bg-color, #ffffff);">
                                <button onclick="toggleChapter('${sub.id}')" class="w-full text-right p-3 font-bold flex justify-between items-center text-sm" style="color: var(--tg-theme-text-color, #1f2937);">
                                    <span>${sub.name}</span>
                                    <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-semibold">${sub.questions.length} أسئلة ▾</span>
                                </button>
                                <div id="content-${sub.id}" class="chapter-content bg-gray-50" style="background-color: var(--tg-theme-bg-color, #f9fafb);">
                                    <div class="p-3 space-y-3">
                                        ${sub.questions.length > 0 
                                            ? sub.questions.map(q => renderQuestion(q)).join('')
                                            : '<p class="text-xs text-gray-400 text-center py-2">سيتم إضافة الأسئلة قريباً...</p>'
                                        }
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    unitHTML += `</div></div>`;
                    container.insertAdjacentHTML('beforeend', unitHTML);
                });
            } else {
                container.innerHTML = `<p class="text-center text-gray-500 py-10">سيتم إضافة أسئلة ${subjectName} قريباً!</p>`;
            }
            
            modal.classList.remove('modal-hidden');
        }

        function closeSubject() {
            document.getElementById('subject-modal').classList.add('modal-hidden');
        }

        function renderQuestion(q) {
            return `
                <div class="p-3 bg-white rounded-lg shadow-sm border border-gray-100" style="background-color: var(--tg-theme-secondary-bg-color, #ffffff);">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="badge bg-purple-100 text-purple-700 px-2 py-0.5 rounded font-bold">📅 ${q.year}</span>
                    </div>
                    <p class="font-medium text-sm mb-3 leading-relaxed" style="color: var(--tg-theme-text-color, #1f2937);">${q.text}</p>
                    <button onclick="showAnswer('${q.id}')" class="text-xs bg-gray-100 text-gray-700 font-bold px-3 py-1.5 rounded-md w-full">إظهار الجواب النموذجي 👁️</button>
                    <div id="answer-${q.id}" class="hidden mt-2 p-2.5 bg-green-50 text-green-800 text-sm rounded border border-green-100 whitespace-pre-line leading-relaxed">
                        ${q.answer}
                    </div>
                </div>
            `;
        }

        function showAnswer(qId) {
            const ans = document.getElementById(`answer-${qId}`);
            ans.classList.toggle('hidden');
        }

        function toggleChapter(subId) {
            const content = document.getElementById(`content-${subId}`);
            content.classList.toggle('chapter-expanded');
        }
    </script>
