<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة السادس الإعدادي التفاعلية</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- خط Cairo الأنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            background-color: var(--tg-theme-bg-color, #f8fafc); 
            color: var(--tg-theme-text-color, #0f172a); 
        }
        .card-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-btn:active {
            transform: scale(0.94);
        }
        .modal { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .modal-hidden { 
            opacity: 0; 
            pointer-events: none; 
            transform: translateY(100%); 
        }
        .chapter-content { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.4s ease-in-out; 
        }
        .chapter-expanded { 
            max-height: 5000px; 
        }
        
        /* تدرجات ألوان مميزة */
        .grad-islamic { background: linear-gradient(135deg, #10b981, #047857); }
        .grad-arabic { background: linear-gradient(135deg, #f59e0b, #b45309); }
        .grad-english { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .grad-biology { background: linear-gradient(135deg, #ec4899, #be185d); }
        .grad-math { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .grad-chemistry { background: linear-gradient(135deg, #14b8a6, #0f766e); }
        .grad-physics { background: linear-gradient(135deg, #f43f5e, #be123c); }
    </style>
</head>
<body class="antialiased pb-10 select-none">

    <!-- شريط الترحيب -->
    <div class="bg-white/80 backdrop-blur-md shadow-sm p-4 rounded-b-3xl mb-6 mx-2 mt-2 flex justify-between items-center border border-slate-100">
        <div>
            <h1 class="text-lg font-black text-slate-800" id="welcome-text">أهلاً بك يا بطل 🎓</h1>
            <p class="text-xs font-semibold text-slate-500">اختر المادة وابدأ التحدي والمراجعة</p>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-emerald-100 flex items-center justify-center text-xl shadow-inner">
            🇮🇶
        </div>
    </div>

    <!-- شبكة المواد -->
    <div class="px-4 grid grid-cols-2 gap-3.5">
        <div onclick="playClick(); openSubject('islamic', 'التربية الإسلامية')" class="card-btn grad-islamic text-white p-4 rounded-2xl shadow-lg shadow-emerald-500/20 flex flex-col items-center justify-center gap-1.5 cursor-pointer">
            <span class="text-3xl filter drop-shadow">🕋</span>
            <span class="font-extrabold text-sm">الإسلامية</span>
        </div>
        <div onclick="playClick(); openSubject('arabic', 'اللغة العربية')" class="card-btn grad-arabic text-white p-4 rounded-2xl shadow-lg shadow-amber-500/20 flex flex-col items-center justify-center gap-1.5 cursor-pointer">
            <span class="text-3xl filter drop-shadow">📖</span>
            <span class="font-extrabold text-sm">العربية</span>
        </div>
        <div onclick="playClick(); openSubject('english', 'اللغة الإنكليزية')" class="card-btn grad-english text-white p-4 rounded-2xl shadow-lg shadow-blue-500/20 flex flex-col items-center justify-center gap-1.5 cursor-pointer">
            <span class="text-3xl filter drop-shadow">🔠</span>
            <span class="font-extrabold text-sm">الإنكليزية</span>
        </div>
        <div onclick="playClick(); openSubject('biology', 'علم الأحياء')" class="card-btn grad-biology text-white p-4 rounded-2xl shadow-lg shadow-pink-500/20 flex flex-col items-center justify-center gap-1.5 cursor-pointer">
            <span class="text-3xl filter drop-shadow">🧬</span>
            <span class="font-extrabold text-sm">الأحياء</span>
        </div>
        <div onclick="playClick(); openSubject('math', 'الرياضيات')" class="card-btn grad-math text-white p-4 rounded-2xl shadow-lg shadow-purple-500/20 flex flex-col items-center justify-center gap-1.5 cursor-pointer">
            <span class="text-3xl filter drop-shadow">📐</span>
            <span class="font-extrabold text-sm">الرياضيات</span>
        </div>
        <div onclick="openSubject('chemistry', 'الكيمياء')" class="card-btn grad-chemistry text-white p-4 rounded-2xl shadow-lg shadow-teal-500/20 flex flex-col items-center justify-center gap-1.5 cursor-pointer">
            <span class="text-3xl filter drop-shadow">🧪</span>
            <span class="font-extrabold text-sm">الكيمياء</span>
        </div>
        <div onclick="playClick(); openSubject('physics', 'الفيزياء')" class="card-btn grad-physics text-white p-4 rounded-2xl shadow-lg shadow-rose-500/20 flex flex-col items-center justify-center gap-1.5 cursor-pointer col-span-2">
            <span class="text-3xl filter drop-shadow">⚡</span>
            <span class="font-extrabold text-sm">الفيزياء</span>
        </div>
    </div>

    <!-- نافذة أسئلة المادة -->
    <div id="subject-modal" class="modal modal-hidden fixed inset-0 z-50 flex flex-col bg-slate-50">
        <div class="bg-white/90 backdrop-blur-md p-4 shadow-sm flex justify-between items-center sticky top-0 z-10 border-b border-slate-100">
            <h2 id="modal-title" class="text-base font-black text-slate-800">اسم المادة</h2>
            <button onclick="playClick(); closeSubject()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded-xl text-xs font-bold transition">إغلاق ✕</button>
        </div>

        <div id="modal-chapters-container" class="p-4 flex-1 overflow-y-auto space-y-3"></div>
    </div>

    <script src="data.js"></script>

    <script>
        // --- 1. محرك الأصوات والتأثيرات الصوتية (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClick() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playCorrectSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
            osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(now + 0.35);
        }

        function playWrongSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(110, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(now + 0.25);
        }

        // --- 2. إدارة Telegram Mini App ---
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let userName = "يا بطل";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userName = tg.initDataUnsafe.user.first_name;
        }
        document.getElementById('welcome-text').innerText = `أهلاً بك يا ${userName} 🎓`;

        // --- 3. عرض الفصول والأسئلة ---
        function openSubject(subjectKey, subjectName) {
            const modal = document.getElementById('subject-modal');
            document.getElementById('modal-title').innerText = subjectName;
            const container = document.getElementById('modal-chapters-container');
            container.innerHTML = '';
            
            if (typeof subjectsData !== 'undefined' && subjectsData[subjectKey] && subjectsData[subjectKey].length > 0) {
                subjectsData[subjectKey].forEach(unit => {
                    let unitHTML = `
                        <div class="mb-4">
                            <h3 class="text-xs font-black text-emerald-800 bg-emerald-100/60 p-2.5 rounded-xl border border-emerald-200/50 mb-2">${unit.title}</h3>
                            <div class="space-y-2">
                    `;

                    unit.subsections.forEach(sub => {
                        unitHTML += `
                            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                <button onclick="playClick(); toggleChapter('${sub.id}')" class="w-full text-right p-3.5 font-bold flex justify-between items-center text-xs text-slate-800">
                                    <span>${sub.name}</span>
                                    <span class="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full font-bold border border-emerald-100">${sub.questions.length} أسئلة ▾</span>
                                </button>
                                <div id="content-${sub.id}" class="chapter-content bg-slate-50/50">
                                    <div class="p-3 space-y-3">
                                        ${sub.questions.length > 0 
                                            ? sub.questions.map(q => renderQuestion(q)).join('')
                                            : '<p class="text-xs text-slate-400 text-center py-2">قريباً إضافة باقي الأسئلة...</p>'
                                        }
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    unitHTML += `</div></div>`;
                    container.insertAdjacentHTML('beforeend', unitHTML);
                });
            } else {
                container.innerHTML = `<p class="text-center text-slate-400 font-bold py-10 text-xs">جاري تجهيز أسئلة ${subjectName}...</p>`;
            }
            
            modal.classList.remove('modal-hidden');
        }

        function closeSubject() {
            document.getElementById('subject-modal').classList.add('modal-hidden');
        }

        function renderQuestion(q) {
            let optionsHTML = '';
            if (q.options && q.options.length > 0) {
                optionsHTML = `
                    <div class="grid grid-cols-2 gap-1.5 mt-2">
                        ${q.options.map(opt => `
                            <button onclick="checkAnswer(this, '${opt}', '${q.answer}')" class="text-xs font-bold p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-200/60 transition">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                `;
            }

            return `
                <div class="p-3.5 bg-white rounded-xl shadow-sm border border-slate-100">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[10px] bg-purple-50 text-purple-700 border border-purple-100 px-2 py-0.5 rounded-md font-extrabold">📅 ${q.year}</span>
                    </div>
                    <p class="font-bold text-xs mb-2 leading-relaxed text-slate-800">${q.text}</p>
                    
                    ${optionsHTML}

                    <button onclick="playClick(); showAnswer('${q.id}')" class="text-[11px] bg-slate-100 text-slate-600 font-bold px-3 py-1.5 rounded-lg w-full mt-2 border border-slate-200/50">
                        عرض / إخفاء الجواب النموذجي 👁️
                    </button>
                    <div id="answer-${q.id}" class="hidden mt-2 p-2.5 bg-emerald-50 text-emerald-900 text-xs font-semibold rounded-lg border border-emerald-100 whitespace-pre-line leading-relaxed">
                        ${q.answer}
                    </div>
                </div>
            `;
        }

        function checkAnswer(btn, selected, correct) {
            const parent = btn.parentElement;
            const buttons = parent.querySelectorAll('button');
            
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.remove('bg-slate-100', 'hover:bg-slate-200');
            });

            if (selected.trim() === correct.trim()) {
                playCorrectSound();
                btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
            } else {
                playWrongSound();
                btn.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                // تظليل الجواب الصحيح
                buttons.forEach(b => {
                    if (b.innerText.trim() === correct.trim()) {
                        b.classList.add('bg-emerald-100', 'text-emerald-800', 'border-emerald-300');
                    }
                });
            }
        }

        function showAnswer(qId) {
            const ans = document.getElementById(`answer-${qId}`);
            ans.classList.toggle('hidden');
        }

        function toggleChapter(subId) {
            const content = document.getElementById(`content-${subId}`);
            content.classList.toggle('chapter-expanded');
        }
    </script>
</body>
</html>
