<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة السادس الإعدادي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: var(--tg-theme-bg-color, #f3f4f6); color: var(--tg-theme-text-color, #1f2937); }
        .subject-card { transition: transform 0.2s; }
        .subject-card:active { transform: scale(0.96); }
        .modal { transition: opacity 0.3s ease, transform 0.3s ease; }
        .modal-hidden { opacity: 0; pointer-events: none; transform: translateY(20px); }
        .chapter-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
        .chapter-expanded { max-height: 2000px; }
        .badge { font-size: 0.7rem; }
        /* ألوان المواد */
        .bg-islamic { background: linear-gradient(135deg, #10b981, #059669); }
        .bg-arabic { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .bg-english { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .bg-biology { background: linear-gradient(135deg, #ec4899, #db2777); }
        .bg-math { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .bg-chemistry { background: linear-gradient(135deg, #14b8a6, #0d9488); }
        .bg-physics { background: linear-gradient(135deg, #f43f5e, #e11d48); }
    </style>
</head>
<body class="antialiased pb-10">

    <!-- شريط الترحيب (Telegram) -->
    <div class="bg-white dark:bg-gray-800 shadow-sm p-4 rounded-b-3xl mb-6 mx-2 mt-2 flex justify-between items-center" style="background-color: var(--tg-theme-secondary-bg-color, #ffffff);">
        <div>
            <h1 class="text-xl font-bold text-gray-800" style="color: var(--tg-theme-text-color, #1f2937);" id="welcome-text">مرحباً يا بطل 🎓</h1>
            <p class="text-sm text-gray-500" style="color: var(--tg-theme-hint-color, #6b7280);">اختر المادة لتبدأ الاختبار</p>
        </div>
        <div class="text-2xl">🇮🇶</div>
    </div>

    <!-- شبكة المواد -->
    <div class="px-4 grid grid-cols-2 gap-4">
        <div onclick="openSubject('islamic', 'التربية الإسلامية')" class="subject-card bg-islamic text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
            <span class="text-3xl">🕋</span><span class="font-bold">الإسلامية</span>
        </div>
        <div onclick="openSubject('arabic', 'اللغة العربية')" class="subject-card bg-arabic text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
            <span class="text-3xl">📖</span><span class="font-bold">العربية</span>
        </div>
        <div onclick="openSubject('english', 'اللغة الإنكليزية')" class="subject-card bg-english text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
            <span class="text-3xl">🔠</span><span class="font-bold">الإنكليزية</span>
        </div>
        <div onclick="openSubject('biology', 'الأحياء')" class="subject-card bg-biology text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
            <span class="text-3xl">🧬</span><span class="font-bold">الأحياء</span>
        </div>
        <div onclick="openSubject('math', 'الرياضيات')" class="subject-card bg-math text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
            <span class="text-3xl">📐</span><span class="font-bold">الرياضيات</span>
        </div>
        <div onclick="openSubject('chemistry', 'الكيمياء')" class="subject-card bg-chemistry text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer">
            <span class="text-3xl">🧪</span><span class="font-bold">الكيمياء</span>
        </div>
        <div onclick="openSubject('physics', 'الفيزياء')" class="subject-card bg-physics text-white p-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 cursor-pointer col-span-2">
            <span class="text-3xl">⚡</span><span class="font-bold">الفيزياء</span>
        </div>
    </div>

    <!-- نافذة المادة المنبثقة (Modal) -->
    <div id="subject-modal" class="modal modal-hidden fixed inset-0 z-50 flex flex-col bg-gray-50" style="background-color: var(--tg-theme-bg-color, #f3f4f6);">
        <!-- رأس النافذة -->
        <div class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-10" style="background-color: var(--tg-theme-secondary-bg-color, #ffffff);">
            <h2 id="modal-title" class="text-xl font-bold" style="color: var(--tg-theme-text-color, #1f2937);">اسم المادة</h2>
            <button onclick="closeSubject()" class="bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm font-bold">عودة ✕</button>
        </div>

        <!-- المؤقت -->
        <div id="timer-bar" class="hidden bg-red-100 text-red-700 p-2 text-center font-bold text-sm shadow-inner">
            ⏳ الوقت المتبقي: <span id="time-display">15:00</span>
        </div>

        <!-- قائمة المباحث/الفصول -->
        <div id="modal-chapters-container" class="p-4 flex-1 overflow-y-auto space-y-3">
            <!-- تُولد الفصول هنا برمجياً -->
        </div>
    </div>

    <script>
        // 1. إعداد تيليجرام
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let userName = "يا بطل";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userName = tg.initDataUnsafe.user.first_name;
        }
        document.getElementById('welcome-text').innerText = `مرحباً ${userName} 🎓`;

        // 2. إدارة البيانات والتقدم (Local Storage)
        let userProgress = JSON.parse(localStorage.getItem('sadsProgress')) || {};
        let currentTimer = null;
        let timeLeft = 900; // 15 دقيقة لكل فصل

        const subjectsData = {
            'islamic': [
                {
                    id: 'ch1',
                    title: 'المبحث الأول: أحكام التلاوة',
                    questions: [
                        { id: 'q1', text: 'ما حكم النون الساكنة في قوله تعالى (من يعمل)؟', year: '2023 الدور الأول', answer: 'إدغام بغنة.' },
                        { id: 'q2', text: 'عرف الإظهار الحلقي مع ذكر مثال.', year: '2022 التمهيدي', answer: 'إخراج النون الساكنة من مخرجها من غير غنة، مثال: (من آمن).' }
                    ]
                },
                {
                    id: 'ch2',
                    title: 'المبحث الثاني: الحفظ والتفسير',
                    questions: [
                        { id: 'q3', text: 'اكتب ما تحفظه من سورة البقرة من قوله تعالى (يا أيها الذين آمنوا كتب عليكم الصيام...)', year: '2021 الدور الثاني', answer: 'تراجع الآيات 183-185 من سورة البقرة.' }
                    ]
                }
            ]
            // يمكنك إضافة باقي المواد بنفس الهيكلية
        };

        // 3. فتح المادة
        function openSubject(subjectKey, subjectName) {
            const modal = document.getElementById('subject-modal');
            document.getElementById('modal-title').innerText = subjectName;
            const container = document.getElementById('modal-chapters-container');
            container.innerHTML = '';
            
            if (subjectsData[subjectKey]) {
                subjectsData[subjectKey].forEach(chapter => {
                    // حساب تقدم الفصل
                    let chProgress = userProgress[`${subjectKey}_${chapter.id}`] || {};
                    let answeredCount = Object.keys(chProgress).length;
                    let isCompleted = answeredCount === chapter.questions.length;

                    const chapterHTML = `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden" style="background-color: var(--tg-theme-secondary-bg-color, #ffffff); border-color: var(--tg-theme-hint-color, #e5e7eb);">
                            <button onclick="toggleChapter('${subjectKey}', '${chapter.id}')" class="w-full text-right p-4 font-bold flex justify-between items-center" style="color: var(--tg-theme-text-color, #1f2937);">
                                <span>${chapter.title}</span>
                                <span class="text-sm ${isCompleted ? 'text-green-500' : 'text-gray-400'}">${answeredCount}/${chapter.questions.length} ▾</span>
                            </button>
                            <div id="content-${chapter.id}" class="chapter-content bg-gray-50 p-0" style="background-color: var(--tg-theme-bg-color, #f9fafb);">
                                <div class="p-4 space-y-4">
                                    ${chapter.questions.map(q => renderQuestion(subjectKey, chapter.id, q, chProgress[q.id])).join('')}
                                    <div id="result-${chapter.id}" class="hidden mt-4 p-4 bg-blue-50 rounded-lg text-center"></div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', chapterHTML);
                });
            } else {
                container.innerHTML = `<p class="text-center text-gray-500 py-10">سيتم إضافة أسئلة ${subjectName} قريباً!</p>`;
            }
            
            modal.classList.remove('modal-hidden');
        }

        function closeSubject() {
            document.getElementById('subject-modal').classList.add('modal-hidden');
            stopTimer();
        }

        // 4. عرض الأسئلة والأجوبة
        function renderQuestion(subjectKey, chapterId, q, savedStatus) {
            let statusBadge = '';
            if (savedStatus === 'correct') statusBadge = '<span class="text-green-500 text-xs font-bold mr-2">✅ أجبت بشكل صحيح</span>';
            if (savedStatus === 'wrong') statusBadge = '<span class="text-red-500 text-xs font-bold mr-2">❌ تحتاج مراجعة</span>';

            return `
                <div class="p-3 bg-white rounded-lg shadow-sm border border-gray-100" id="q-container-${q.id}">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="badge bg-purple-100 text-purple-700 px-2 py-1 rounded-md">📅 ${q.year}</span>
                        ${statusBadge}
                    </div>
                    <p class="font-medium text-sm mb-3" style="color: var(--tg-theme-text-color, #1f2937);">${q.text}</p>
                    
                    <button onclick="showAnswer('${q.id}')" class="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-md w-full mb-2">إظهار الجواب النموذجي 👁️</button>
                    
                    <div id="answer-${q.id}" class="hidden">
                        <p class="text-sm text-green-700 bg-green-50 p-2 rounded border border-green-100 mb-3">${q.answer}</p>
                        <div class="flex gap-2">
                            <button onclick="saveAnswer('${subjectKey}', '${chapterId}', '${q.id}', 'correct')" class="flex-1 bg-green-500 text-white text-xs py-2 rounded">أجبت صح ✅</button>
                            <button onclick="saveAnswer('${subjectKey}', '${chapterId}', '${q.id}', 'wrong')" class="flex-1 bg-red-500 text-white text-xs py-2 rounded">أخطأت ❌</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function showAnswer(qId) {
            document.getElementById(`answer-${qId}`).classList.remove('hidden');
        }

        // 5. حفظ التقدم والنتائج
        function saveAnswer(subjectKey, chapterId, qId, status) {
            const key = `${subjectKey}_${chapterId}`;
            if (!userProgress[key]) userProgress[key] = {};
            
            userProgress[key][qId] = status;
            localStorage.setItem('sadsProgress', JSON.stringify(userProgress));
            
            // تحديث الواجهة للسؤال
            document.getElementById(`answer-${qId}`).classList.add('hidden');
            openSubject(subjectKey, document.getElementById('modal-title').innerText); // إعادة تحميل لتحديث الشارات
            document.getElementById(`content-${chapterId}`).classList.add('chapter-expanded'); // إبقاء الفصل مفتوحاً
            
            checkChapterCompletion(subjectKey, chapterId);
        }

        // 6. ملخص النتائج والمشاركة
        function checkChapterCompletion(subjectKey, chapterId) {
            const chapter = subjectsData[subjectKey].find(c => c.id === chapterId);
            const progress = userProgress[`${subjectKey}_${chapterId}`] || {};
            
            if (Object.keys(progress).length === chapter.questions.length) {
                stopTimer();
                let correctCount = Object.values(progress).filter(v => v === 'correct').length;
                let total = chapter.questions.length;
                
                const resultDiv = document.getElementById(`result-${chapterId}`);
                resultDiv.classList.remove('hidden');
                resultDiv.innerHTML = `
                    <h3 class="font-bold text-blue-800">🎉 اكتمل الفصل!</h3>
                    <p class="text-sm text-blue-600 mb-2">إجاباتك الصحيحة: ${correctCount} من ${total}</p>
                    <button onclick="shareScore('${chapter.title}', ${correctCount}, ${total})" class="bg-blue-500 text-white px-4 py-2 rounded-full text-sm font-bold w-full shadow-md">
                        شارك نتيجتك عبر تيليجرام ✈️
                    </button>
                `;
            }
        }

        function shareScore(chapterTitle, correct, total) {
            const shareText = `اختبرت نفسي في مادة السادس الإعدادي (${chapterTitle}) وحصلت على ${correct}/${total} ✅. اختبر نفسك الآن عبر المنصة!`;
            // توجيه لتيليجرام لمشاركة النص (يمكنك لاحقاً إضافة رابط البوت الخاص بك في الرابط)
            tg.openTelegramLink(`https://t.me/share/url?url=https://t.me/your_bot_username&text=${encodeURIComponent(shareText)}`);
        }

        // 7. المؤقت وتوسيع الفصل
        function toggleChapter(subjectKey, chapterId) {
            const content = document.getElementById(`content-${chapterId}`);
            const isExpanded = content.classList.contains('chapter-expanded');
            
            // إغلاق الجميع
            document.querySelectorAll('.chapter-content').forEach(el => el.classList.remove('chapter-expanded'));
            
            if (!isExpanded) {
                content.classList.add('chapter-expanded');
                startTimer();
                checkChapterCompletion(subjectKey, chapterId);
            } else {
                stopTimer();
            }
        }

        function startTimer() {
            stopTimer();
            timeLeft = 900; // إعادة تعيين لـ 15 دقيقة
            const timerBar = document.getElementById('timer-bar');
            const timeDisplay = document.getElementById('time-display');
            timerBar.classList.remove('hidden');
            
            currentTimer = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                timeDisplay.innerText = `${m}:${s < 10 ? '0' + s : s}`;
                if (timeLeft <= 0) stopTimer();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(currentTimer);
            document.getElementById('timer-bar').classList.add('hidden');
        }
    </script>
</body>
</html>
